<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="description" content="OneLaser BFCM 2026 creative gallery. Browse campaign artwork and download PNG or WebP."><title>OneLaser · BFCM 2026 设计预览</title>
<style>
:root{--paper:#111112;--panel:#1a1a1d;--line:#333337;--muted:#a4a4ad;--ink:#f7f5f0;--red:#ff3b24;--gold:#e8c28a;font-family:"Helvetica Neue","PingFang SC",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}a{color:inherit}button,select{font:inherit}button,a,select{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:4px}header{max-width:1640px;margin:auto;padding:30px 40px 0}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:24px}.logo{width:170px;height:47px;object-fit:contain;object-position:left}.lang{display:flex;border:1px solid var(--line);border-radius:6px;padding:3px;gap:3px}.lang button{background:transparent;color:var(--muted);border:0;border-radius:3px;padding:9px 13px;cursor:pointer}.lang button[aria-pressed=true]{color:var(--ink);background:#38383c}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;padding:55px 0 38px}.eyebrow{font:12px "SFMono-Regular",Consolas,monospace;color:var(--red);letter-spacing:.16em;margin:0 0 16px}.hero h1{font-size:clamp(32px,4.8vw,67px);font-weight:550;letter-spacing:-.055em;line-height:1.08;margin:0}.hero p{font-size:15px;line-height:1.7;color:var(--muted);margin:20px 0 0;max-width:690px}.edition{flex-shrink:0;text-align:right}.edition strong{font-size:35px;font-weight:450;letter-spacing:-.05em}.edition small{display:block;color:var(--muted);font-size:12px;margin-top:9px}.status{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;display:flex;gap:16px;align-items:center;font-size:13px;color:var(--muted);line-height:1.6}.status .dot{width:7px;height:7px;background:var(--gold);border-radius:100%;flex-shrink:0}.toolbar{position:sticky;top:0;z-index:10;background:rgba(17,17,18,.96);backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.toolbar-inner{max-width:1640px;margin:auto;padding:22px 40px;display:flex;gap:12px;align-items:center}.filter{position:relative;min-width:160px}.filter span{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;margin-bottom:7px}select{width:100%;padding:10px 32px 10px 12px;border:1px solid #414146;border-radius:5px;background:#252529;color:var(--ink);font-size:13px;cursor:pointer}.reset{background:transparent;border:0;color:var(--muted);font-size:13px;cursor:pointer;margin:19px 5px 0;padding:10px}.count{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}.gallery{max-width:1640px;margin:auto;padding:28px 40px 70px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.picture{display:flex;align-items:center;justify-content:center;height:350px;background:#080809;padding:14px;position:relative;text-decoration:none}.picture img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .25s}.picture:hover img{transform:scale(1.025)}.picture:after{content:"↗";position:absolute;right:12px;top:12px;color:#fff;background:#111b;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;opacity:0;transition:opacity .2s}.picture:hover:after,.picture:focus:after{opacity:1}.info{padding:20px}.info h2{font-size:16px;font-weight:550;margin:0 0 9px;line-height:1.5}.meta{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.downloads{display:flex;gap:10px;margin-top:18px}.downloads a{border:1px solid #4c4c50;border-radius:5px;padding:8px 12px;text-decoration:none;font-size:12px;transition:background .2s}.downloads a:first-child{border-color:#823c31;color:#ffb7a9}.downloads a:hover{background:#333337}.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--muted)}footer{border-top:1px solid var(--line);max-width:1560px;margin:0 auto;padding:24px 0 36px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px;line-height:1.8}footer a{text-underline-offset:4px}.bundle{display:inline-block;margin-top:18px;color:var(--gold);font-size:13px;text-underline-offset:4px}.error{color:#ffb7a9}@media(min-width:1600px){.picture{height:415px}}@media(max-width:1050px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.picture{height:360px}.hero{gap:20px}.edition{display:none}footer{margin:0 40px}}@media(max-width:650px){header{padding:20px 20px 0}.topbar{padding-bottom:18px}.logo{width:140px;height:39px}.lang button{font-size:12px;padding:8px 10px}.hero{padding:34px 0 27px}.hero p{font-size:13px;margin-top:16px}.eyebrow{font-size:10px}.status{font-size:12px;align-items:flex-start;padding:12px 0}.status .dot{margin-top:6px}.toolbar-inner{padding:16px 20px;gap:9px;flex-wrap:wrap}.filter{min-width:0;flex:1}.filter:first-child{flex-basis:100%}.filter span{font-size:9px}.reset{margin-top:15px;padding:10px 4px;font-size:12px}.count{width:100%;margin:5px 0 0}.gallery{grid-template-columns:1fr;padding:20px;gap:20px}.picture{height:380px}.info{padding:18px}footer{margin:20px;padding:20px 0;display:block}footer span{display:block;margin-top:6px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><header><div class="topbar"><img class="logo" src="assets/logo.png" alt="OneLaser — Make Better With One"><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div><div class="hero"><div><p class="eyebrow">ONELASER / BFCM 2026</p><h1 data-i18n="title">黑五设计预览</h1><p data-i18n="intro">按产品、视觉方案与投放尺寸浏览设计，点击图片查看大图，下载 PNG 或 WebP。</p><a class="bundle" id="bundle" hidden></a></div><div class="edition"><strong>2026</strong><small>BLACK FRIDAY / CYBER MONDAY</small></div></div><div class="status"><span class="dot"></span><span id="status" aria-live="polite"></span></div></header>
<section class="toolbar" aria-label="Filters"><div class="toolbar-inner"><label class="filter"><span data-i18n="product">产品 / 活动</span><select id="group"></select></label><label class="filter"><span data-i18n="style">视觉方案</span><select id="style"></select></label><label class="filter"><span data-i18n="size">尺寸 / 版位</span><select id="size"></select></label><button class="reset" type="button" id="reset" data-i18n="reset">重置</button><span class="count" id="count" aria-live="polite"></span></div></section>
<main class="gallery" id="gallery" aria-label="Artwork gallery"></main><footer><div data-i18n="footer">OneLaser · 2026 黑五活动设计预览</div><span data-i18n="note">海报文案为英文 · 下载格式 PNG / WebP</span></footer>
<script>
'use strict';
const COPY={zh:{title:'黑五设计预览',intro:'按产品、视觉方案与投放尺寸浏览设计，点击图片查看大图，下载 PNG 或 WebP。',product:'产品 / 活动',style:'视觉方案',size:'尺寸 / 版位',reset:'重置',allGroup:'全部产品与活动',allStyle:'全部方案',allSize:'全部尺寸',footer:'OneLaser · 2026 黑五活动设计预览',note:'海报文案为英文 · 下载格式 PNG / WebP',png:'下载 PNG',webp:'下载 WebP',open:'查看大图',empty:'没有匹配的设计，请调整筛选条件。',error:'暂时无法加载素材，请刷新页面重试。',bundle:'下载全部 PNG + WebP',status:(n,t)=>n===t?`全套 ${n} 张设计 · PNG + WebP`:`图片替换进行中 · 已更新 ${n} / ${t} 张 · 后续新图会继续补齐`,count:(n,t)=>`当前显示 ${n} / ${t} 张`,styles:{A:'A · 黑金舞台',B:'B · 红黑激光',C:'C · 简洁白底'},groups:{XRF38:'XRF 38W RF',Hydra07_S1:'Hydra 7 Pro · 前 14 台',Hydra07_S2:'Hydra 7 Pro · 第二阶段',Cobra:'Cobra 8 / 10 / 14',VertiGo:'VertiGo 38W RF',Hydra09Hybrid:'Hydra 9 Hybrid',Brand:'品牌活动 · 最高省 $3,000',Brand_After14:'品牌活动 · 最高省 $2,000',Banner:'官网 Banner · $3,000',Banner_After14:'官网 Banner · $2,000'},sizes:{'1x1':'方形 · 1:1','4x5':'信息流 · 4:5','9x16':'Story · 9:16',Google:'Google · 横版',EDM:'EDM · 横版',Desktop:'桌面 Banner',Mobile:'移动 Banner'}},en:{title:'Black Friday creative gallery',intro:'Explore campaign artwork by product, visual direction and placement. Open any image at full size and download PNG or WebP.',product:'PRODUCT / CAMPAIGN',style:'VISUAL DIRECTION',size:'SIZE / PLACEMENT',reset:'Reset',allGroup:'All products & campaigns',allStyle:'All directions',allSize:'All sizes',footer:'OneLaser · BFCM 2026 creative preview',note:'Artwork copy in English · PNG / WebP downloads',png:'Download PNG',webp:'Download WebP',open:'View full image',empty:'No matching artwork. Try another filter.',error:'Artwork could not be loaded. Please refresh and try again.',bundle:'Download all PNG + WebP',status:(n,t)=>n===t?`Complete collection: ${n} designs · PNG + WebP`:`Artwork updates in progress · ${n} of ${t} replaced · More designs to follow`,count:(n,t)=>`Showing ${n} of ${t} designs`,styles:{A:'A · Black & gold stage',B:'B · Red & black laser',C:'C · Clean white'},groups:{XRF38:'XRF 38W RF',Hydra07_S1:'Hydra 7 Pro · First 14 units',Hydra07_S2:'Hydra 7 Pro · Phase 2',Cobra:'Cobra 8 / 10 / 14',VertiGo:'VertiGo 38W RF',Hydra09Hybrid:'Hydra 9 Hybrid',Brand:'Brand campaign · Up to $3,000 off',Brand_After14:'Brand campaign · Up to $2,000 off',Banner:'Website banner · $3,000',Banner_After14:'Website banner · $2,000'},sizes:{'1x1':'Square · 1:1','4x5':'Feed · 4:5','9x16':'Story · 9:16',Google:'Google · Landscape',EDM:'EDM · Landscape',Desktop:'Desktop banner',Mobile:'Mobile banner'}}};
const $=id=>document.getElementById(id);let saved;try{saved=localStorage.getItem('onelaser-gallery-language')}catch{}let lang=new URL(location.href).searchParams.get('lang')||saved||'zh';if(!COPY[lang])lang='zh';let data={items:[],total:132},loaded=false;
const groups=Object.keys(COPY.zh.groups),sizes=Object.keys(COPY.zh.sizes);function options(id,keys,map,all){const el=$(id),value=el.value;el.replaceChildren(new Option(all,''),...keys.map(k=>new Option(map[k]||k,k)));el.value=keys.includes(value)?value:'';}
function setLanguage(next){lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=`OneLaser · BFCM 2026 ${lang==='zh'?'设计预览':'Creative Gallery'}`;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=COPY[lang][e.dataset.i18n]);options('group',groups,COPY[lang].groups,COPY[lang].allGroup);options('style',['A','B','C'],COPY[lang].styles,COPY[lang].allStyle);options('size',sizes,COPY[lang].sizes,COPY[lang].allSize);$('status').textContent=COPY[lang].status(data.items.length,data.total);if(data.bundle){$('bundle').href=data.bundle;$('bundle').textContent=COPY[lang].bundle;$('bundle').hidden=false;}try{localStorage.setItem('onelaser-gallery-language',lang)}catch{}const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);render();}
function render(){const c=COPY[lang];const items=data.items.filter(j=>(!$('group').value||j.group===$('group').value)&&(!$('style').value||j.variant===$('style').value)&&(!$('size').value||j.size===$('size').value));$('count').textContent=c.count(items.length,data.items.length);const fragment=document.createDocumentFragment();for(const j of items){const card=document.createElement('article');card.className='card';card.dataset.id=j.id;const picture=document.createElement('a');picture.className='picture';picture.href=j.png;picture.target='_blank';picture.rel='noopener';picture.setAttribute('aria-label',`${c.open}: ${c.groups[j.group]} ${j.variant} ${j.width} × ${j.height}`);const image=document.createElement('img');image.src=j.webp;image.alt=`${c.groups[j.group]} · ${c.styles[j.variant]} · ${j.width} × ${j.height}`;image.loading='lazy';image.decoding='async';picture.append(image);const info=document.createElement('div');info.className='info';const title=document.createElement('h2');title.textContent=c.groups[j.group]||j.group;const meta=document.createElement('p');meta.className='meta';meta.textContent=`${c.styles[j.variant]} · ${c.sizes[j.size]||j.size} · ${j.width} × ${j.height}`;const downloads=document.createElement('div');downloads.className='downloads';for(const type of ['png','webp']){const a=document.createElement('a');a.href=j[type];a.download=j[type].split('/').pop();a.textContent=c[type];downloads.append(a)}info.append(title,meta,downloads);card.append(picture,info);fragment.append(card)}if(!items.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=loaded?c.empty:'…';fragment.append(empty)}$('gallery').replaceChildren(fragment);}
for(const b of document.querySelectorAll('[data-lang]'))b.addEventListener('click',()=>setLanguage(b.dataset.lang));for(const id of ['group','style','size'])$(id).addEventListener('change',render);$('reset').addEventListener('click',()=>{for(const id of ['group','style','size'])$(id).value='';render()});setLanguage(lang);fetch('manifest.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=d;loaded=true;setLanguage(lang)}).catch(()=>{$('status').textContent=COPY[lang].error;$('status').className='error';});
</script></body></html>
